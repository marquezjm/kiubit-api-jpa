spring.application.name=kiubitapi

# DB
spring.datasource.url=jdbc:mysql://localhost:3306/kiubit_schema_jpa?useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.show_sql=true

# Logging para JPA/Hibernate Debug
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
logging.level.org.hibernate.orm.jdbc.bind=TRACE
logging.level.org.springframework.transaction=DEBUG

# JWT
jwt.secret=Q2nQw2v5bVw6w8h9Jz6kP3nX2s5r8u1y4t7z0a6e9d3f2g5h8i1l4o7q0s3v6y9
jwt.expirationMs=3600000

# Port
server.port=8084

# Actuator
management.endpoints.web.exposure.include=health,info,metrics,env,beans,configprops,mappings
management.endpoint.health.show-details=always
management.info.env.enabled=true